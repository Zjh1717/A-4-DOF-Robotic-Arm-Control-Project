mpc:
  horizon: 10                # 预测时域步数 N
  dt: 0.05                   # 采样时间 [s]（20 Hz 控制环）
  max_iter: 100              # 投影梯度最大迭代次数
  lr: 0.05                   # 投影梯度步长
  # 代价函数权重
  Q_position: [100, 100, 100, 50]       # 关节位置误差权重（4 个运动学关节）
  Q_velocity: [1, 1, 1, 1]              # 关节速度平滑权重
  R_control: [0.01, 0.01, 0.01, 0.01]   # 控制量（速度）权重
  # 注意：MPC 硬约束的关节限位/速度限位直接取自 URDF（arm_4dof.urdf 的
  # lower/upper 与 velocity），此处不再重复定义，避免两处不一致。
