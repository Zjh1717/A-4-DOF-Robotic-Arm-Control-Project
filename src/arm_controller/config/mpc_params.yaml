mpc:
  horizon: 10                # 预测时域步数 N
  dt: 0.05                   # 采样时间 [s]
  max_iter: 100              # 求解器最大迭代次数
  # 代价函数权重
  Q_position: [100, 100, 100, 50, 10]   # 关节位置误差权重
  Q_velocity: [1, 1, 1, 1, 0.1]         # 关节速度权重
  R_control: [0.01, 0.01, 0.01, 0.01, 0.01]  # 控制量权重
  # 约束
  joint_limits:
    lower: [-3.14, -1.57, -2.0, -1.57, 0.0]
    upper: [ 3.14,  1.57,  2.0,  1.57, 0.03]
  velocity_limits: [1.0, 1.0, 1.0, 1.0, 0.1]
  